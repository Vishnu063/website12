name: Field Atlas DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Scan source for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'

      - name: Build Docker image
        run: docker build -t field-atlas:ci .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: field-atlas:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: '1'

      - name: Start container
        run: docker run -d --name field-atlas-ci -p 127.0.0.1:8080:80 field-atlas:ci

      - name: Check homepage
        run: |
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 \
            --max-time 5 http://127.0.0.1:8080/ -o /tmp/field-atlas.html
          grep -Fq '<title>Field Atlas' /tmp/field-atlas.html

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login --username vishnu063 --password-stdin

      - name: Push tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="docker.io/vishnu063/field-atlas:sha-${GITHUB_SHA}"
          docker tag field-atlas:ci "$IMAGE"
          docker push "$IMAGE"
          echo "Published image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
