name: Field Atlas CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t field-atlas:ci .

      - name: Start container
        run: docker run -d --name field-atlas-ci -p 127.0.0.1:8080:80 field-atlas:ci

      - name: Check homepage
        run: |
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 \
            --max-time 5 http://127.0.0.1:8080/ -o /tmp/field-atlas.html
          grep -Fq '<title>Field Atlas' /tmp/field-atlas.html
